name: xisa-det

# Mitigation M1/M2: 5-epoch FedAvg with the exact-accumulation stack (detops)
# on every runner, plus a per-epoch timing of both stacks. x86 runners appear
# twice because GitHub assigns Intel or AMD hosts at random.
on:
  push:
    branches: [revision/real-hardware-study]
    paths: [.github/workflows/xisa-det.yml]

jobs:
  det:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, copy: a, torch_index: "https://download.pytorch.org/whl/cpu"}
          - {runner: ubuntu-24.04, copy: b, torch_index: "https://download.pytorch.org/whl/cpu"}
          - {runner: windows-latest, copy: a, torch_index: "https://download.pytorch.org/whl/cpu"}
          - {runner: windows-latest, copy: b, torch_index: "https://download.pytorch.org/whl/cpu"}
          - {runner: ubuntu-24.04-arm, copy: a, torch_index: "https://download.pytorch.org/whl/cpu"}
          - {runner: macos-latest, copy: a, torch_index: "https://pypi.org/simple"}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.1 --index-url ${{ matrix.torch_index }}
          python -m pip install numpy==2.3.5
      - name: Self-checks and deterministic run
        run: |
          python experiments/xisa/prepare_data.py
          python experiments/xisa/detops_check.py
          python experiments/xisa/det_trajectory.py --epochs 5 --rounds 3 --bench \
            --tag gha-${{ matrix.runner }}-${{ matrix.copy }}
      - uses: actions/upload-artifact@v4
        with:
          name: det-gha-${{ matrix.runner }}-${{ matrix.copy }}
          path: experiments/results/xisa/gha-${{ matrix.runner }}-${{ matrix.copy }}/
          retention-days: 90
