name: xisa-pilot

# Runs the cross-ISA divergence pilot natively on GitHub-hosted runners
# (x86_64 and arm64, Linux/Windows/macOS) and uploads the raw results.
on:
  workflow_dispatch:
    inputs:
      rounds:
        description: FedAvg rounds
        default: "20"

jobs:
  pilot:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            torch_index: https://download.pytorch.org/whl/cpu
          - runner: ubuntu-24.04-arm
            torch_index: https://download.pytorch.org/whl/cpu
          - runner: windows-latest
            torch_index: https://download.pytorch.org/whl/cpu
          - runner: macos-latest
            torch_index: https://pypi.org/simple
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.1 --index-url ${{ matrix.torch_index }}
          python -m pip install numpy==2.3.5
      - name: Run pilot
        env:
          PY: python
          ROUNDS: ${{ inputs.rounds }}
          TAG: gha-${{ matrix.runner }}
        run: bash experiments/xisa/run_pilot.sh
      - uses: actions/upload-artifact@v4
        with:
          name: xisa-${{ matrix.runner }}
          path: experiments/results/xisa/
          retention-days: 90
